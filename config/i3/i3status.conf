# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 5
        color_good = '#00FF00'
        color_bad = '#FF0000'
        color_degraded = '#FFFF00'
}

order += "spotify"
order += "keyboard_layout"
order += "net_rate"
order += "whatismyip"
order += "wireless _first_"
order += "ethernet _first_"
order += "conky loadavg"
order += "conky filesystem"
#order += "sysdata"
#order += "disk /"
#order += "diskdata"
#order += "pomodoro"
order += "conky memory"
order += "battery all"
#order += "battery_level"
order += "tztime local"

keyboard_layout {
    layouts = ['gb', 'dk']
}

async_script {
    format = "{output}"
    script_path = "cat /home/pjs/current_layout"
}

pomodoro {
  format = " {mmss}"
  format_separator = ":"
  #format_active = " {mmss}"
  format_break = " {mmss}"
}

spotify {
	format = "( {artist} : {title})"
	format_down = ""
	format_stopped = ""
}
cpu_usage {
        format = "cpu  %usage"
}

sysdata {
        format = " {load1},{load5},{load15}"
}

disk "/" {
	prefix_type = decimal
	format = "⛁ %percentage_used (U:%used, F:%free)"
}


whatismyip {
    format = "🖧 {isp}\|{ip}"
	icon_on = "🖧"
	hide_when_offline = True
	url_geo = "http://ip-api.com/json"
}

wireless _first_ {
	# if you use %speed, i3status requires root privileges
        format_up = " %bitrate %essid (%ip)"
        format_down = ""
}

ethernet _first_ {
	# if you use %speed, i3status requires root privileges
        format_up = " eth (%ip)"
        format_down = ""
}

net_rate {
	format_value = "[\?min_length=10 {value:.1f} {unit}]"
	si_units = "True"
	format = "{down}⇣ {up}⇡"
        interfaces_blacklist = "lo"
}

battery all {
        format = "%status %percentage (%remaining) %consumption"
        format_down = "No battery"
        last_full_capacity = true
        integer_battery_capacity = true
          status_chr = "⚡"
        status_bat = ""
        status_unk = "?"
        status_full = ""
        low_threshold = 15
        threshold_type = time
}

battery_level {
	cache_timeout = 5
	measurement_mode = "acpi"
	hide_when_full = "True"
	hide_seconds = "True"
	blocks = ""
	color_charging = "#00ff00"
	format = " {icon} {percent}% ({time_remaining}) "
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S "
        #format = " %d/%m %H:%M:%S"
}
conky {
    config = {
        'update_interval': 10             # update interval for conky
    }
}
conky swap {
    format = 'Swap [\?color=lightcoral {swap}/{swapmax}] '
    format += '[\?color=swapperc {swapperc}% \[{swapbar}\]]'
    thresholds = [
        (0, 'darkgray'), (0.001, 'good'), (50, 'degraded'),
        (75, 'orange'), (85, 'bad')
    ]
}

conky memory {
    format = 'Memory [\?color=lightskyblue {mem}/{memmax}] '
    format += '[\?color=memperc {memperc}% \[{membar}\]]'
    thresholds = [
        (0, 'darkgray'), (0.001, 'good'), (50, 'degraded'),
        (75, 'orange'), (85, 'bad')
    ]
}
conky filesystem {
    # root filesystem
    format = '/ [\?color=violet {fs_used /}/{fs_size /} '
    format += '[\?color=fs_used_perc./ '
    format += '{fs_used_perc /}% \[{fs_bar /}\]]] '

    thresholds = [
        (0, 'darkgray'), (0.001, 'good'), (50, 'degraded'),
        (75, 'orange'), (85, 'bad')
    ]
}

conky loadavg {
    format = 'Loadavg '
    format += '[\?color=lightgreen {loadavg 1} ]'
    format += '[\?color=lightgreen {loadavg 2} ]'
    format += '[\?color=lightgreen {loadavg 3}]'
}

